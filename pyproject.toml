[build-system]
requires = ["sphinx-theme-builder >= 0.2.0a7"]
build-backend = "sphinx_theme_builder"

[project]
name = "quantecon-sphinx-theme"
description = "A clean, modern, content-focused Sphinx theme with scientific markup support, dark mode, and collapsible table of contents."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "QuantEcon", email = "admin@quantecon.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
]
dependencies = [
    "sphinx>=7,<9",
    "pydata-sphinx-theme>=0.15,<1.0",
    "beautifulsoup4>=4.12",
    "docutils>=0.20",
]

dynamic = ["version"]

[project.optional-dependencies]
doc = [
    "myst-parser>=2.0",
    "sphinx-design>=0.5",
]
dev = [
    "myst-parser>=2.0",
    "sphinx-design>=0.5",
    "sphinx-theme-builder[cli]>=0.2.0a7",
    "nox",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/QuantEcon/quantecon-sphinx-theme"
Repository = "https://github.com/QuantEcon/quantecon-sphinx-theme"
Issues = "https://github.com/QuantEcon/quantecon-sphinx-theme/issues"

[project.entry-points]
"sphinx.html_themes" = {quantecon_sphinx_theme = "quantecon_sphinx_theme"}

[tool.sphinx-theme-builder]
node-version = "20.11.0"
theme-name = "quantecon_sphinx_theme"
